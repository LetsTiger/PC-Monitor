name: Build installer

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Validate release metadata
        shell: pwsh
        run: .\scripts\test-release-metadata.ps1

      - name: Restore win-x64
        run: dotnet restore .\PcMonitor.slnx -r win-x64

      - name: Build Release
        run: dotnet build .\PcMonitor.slnx -c Release --no-restore

      - name: Run tests
        run: dotnet test .\PcMonitor.Tests\PcMonitor.Tests.csproj -c Release --no-build

      - name: Audit vulnerable NuGet packages
        shell: pwsh
        run: |
          $auditJson = dotnet list .\PcMonitor.slnx package `
            --vulnerable `
            --include-transitive `
            --format json `
            --output-version 1 `
            --no-restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (($auditJson -join "`n") -match '"vulnerabilities"\s*:') {
            $auditJson | Write-Output
            throw 'Mindestens ein NuGet-Paket besitzt eine bekannte Schwachstelle.'
          }
          Write-Output 'Keine bekannten Schwachstellen in direkten oder transitiven NuGet-Paketen gefunden.'

      - name: Publish self-contained win-x64
        shell: pwsh
        run: |
          dotnet publish .\PcMonitor.App\PcMonitor.App.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            --no-restore `
            -o .\artifacts\installer-source\app `
            /p:IncludePresentMon=false `
            /p:DebugSymbols=false `
            /p:DebugType=None
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          Copy-Item .\LICENSE .\artifacts\installer-source\app\LICENSE
          Copy-Item .\README.md .\artifacts\installer-source\app\README.md
          Copy-Item .\PRIVACY.md .\artifacts\installer-source\app\PRIVACY.md

      - name: Add source and third-party notices
        shell: pwsh
        run: |
          $sourceRef = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { $env:GITHUB_SHA }
          $sourceUrl = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/tree/$sourceRef"
          .\scripts\prepare-legal-files.ps1 `
            -Destination 'artifacts\installer-source\app' `
            -SourceUrl $sourceUrl

      - name: Install Inno Setup 6.7.1
        run: choco install innosetup --version=6.7.1 --no-progress --yes --limit-output

      - name: Build Inno Setup installer
        shell: pwsh
        run: .\scripts\build-installer.ps1

      - name: Create SHA-256 checksum
        shell: pwsh
        run: |
          $installer = Get-Item .\artifacts\PC-Monitor-0.0.1-beta-win-x64-Setup.exe
          $hash = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $checksumPath = "$($installer.FullName).sha256.txt"
          Set-Content -LiteralPath $checksumPath -Value "$hash  $($installer.Name)" -Encoding ascii

      - name: Upload installer release
        uses: actions/upload-artifact@v7
        with:
          name: PC-Monitor-0.0.1-beta-win-x64-Setup
          path: |
            artifacts/PC-Monitor-0.0.1-beta-win-x64-Setup.exe
            artifacts/PC-Monitor-0.0.1-beta-win-x64-Setup.exe.sha256.txt
          if-no-files-found: error
